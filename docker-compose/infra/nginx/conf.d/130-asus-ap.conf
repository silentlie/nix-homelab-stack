# ASUS RT-AX88U management UI (LAN only).
server {
  listen 80;
  server_name asus-ap.home.arpa;
  return 308 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name asus-ap.home.arpa;

  ssl_certificate     /etc/nginx/certs/asus-ap.crt;
  ssl_certificate_key /etc/nginx/certs/asus-ap.key;

  include /etc/nginx/snippets/ssl-common.conf;
  include /etc/nginx/snippets/lan-only.conf;
  include /etc/nginx/snippets/security-headers.conf;

  # Allow firmware uploads through the management UI.
  client_max_body_size 64m;

  location / {
    include /etc/nginx/snippets/proxy-common.conf;
    # ASUS presents a device-managed/self-signed upstream certificate.
    # Keep frontend TLS validated by the clients' trusted Vault CA.
    proxy_ssl_verify off;
    proxy_pass https://asus-ap-ui;
    proxy_redirect https://192.168.1.2:8443/ /;
  }
}
