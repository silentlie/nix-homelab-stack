# TP-Link VX220-G2v management UI (LAN only).
server {
  listen 80;
  server_name tplink-ap.home.arpa;
  return 308 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name tplink-ap.home.arpa;

  ssl_certificate     /etc/nginx/certs/tplink-ap.crt;
  ssl_certificate_key /etc/nginx/certs/tplink-ap.key;

  include /etc/nginx/snippets/ssl-common.conf;
  include /etc/nginx/snippets/lan-only.conf;
  include /etc/nginx/snippets/security-headers.conf;

  # Allow firmware uploads through the management UI.
  client_max_body_size 64m;

  location / {
    include /etc/nginx/snippets/proxy-common.conf;
    # The router only serves HTTP on its LAN management interface.
    # This upstream hop remains unencrypted: keep it on the trusted LAN.
    proxy_pass http://tplink-ap-ui;
    proxy_redirect http://192.168.1.3/ /;
  }
}
